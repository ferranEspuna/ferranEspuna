<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header wrapper">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main navigation">
    {% assign nav_pages = site.pages | where_exp: 'item', 'item.nav_order != nil' | sort: 'nav_order' %}
    {% for item in nav_pages %}<a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.nav_title | default: item.title | escape }}</a>{% endfor %}
  </nav>
  <label class="theme-control">Theme
    <select id="themeSelect" aria-label="Color theme">
      <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
  </label>
</header>
